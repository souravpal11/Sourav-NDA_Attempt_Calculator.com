<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDA Attempts Calaculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(#aa4a00,#ffffff,#004c02);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: #203a43;
            padding: 25px;
            border-radius: 10px;
            width: 450px;
            /* height: 250px; */
            text-align: center;
        }
        input, button {
            padding: 10px;
            margin-top: 25px;
            width: 95%;
            border-radius: 5px;
            border: none;
        }
        button {
            background: #2c5364;
            color: white;
            cursor: pointer;
            margin-bottom: 20px;
            font-size: 16px;
        }
        button:hover {
            background: #1c3c4c;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
    <h1>NDA Attempts Calculator</h1>

    <label>Date of Birth</label>
    <input type="date" id="dob">

    <button onclick="calculateAttempts()">Calculate</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculateAttempts() {
    const dobInput = document.getElementById("dob").value;
    const resultDiv = document.getElementById("result");

    if (!dobInput) {
        resultDiv.innerHTML = "❌ Please select your Date of Birth";
        return;
    }

    const dob = new Date(dobInput);
    const today = new Date();

    let ageYears = today.getFullYear() - dob.getFullYear();
    let ageMonths = today.getMonth() - dob.getMonth();
    let totalAge = ageYears + ageMonths / 12;

    if (totalAge < 16.5) {
        resultDiv.innerHTML = "⏳ You are not eligible yet for NDA";
        return;
    }

    if (totalAge > 18.5) {
        resultDiv.innerHTML = "❌ Age limit crossed. Not eligible for NDA";
        return;
    }

    let remainingYears = 18.5 - totalAge;
    let attempts = Math.floor(remainingYears * 2);

    if (attempts < 0) attempts = 0;

    resultDiv.innerHTML = `✅ You can attempt NDA <br>📌 Remaining Attempts: <b>${attempts}</b>`;
}
</script>

</script>
</body>
</html>
